<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paid marketing report</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" />
<style>
.slide-fade{transition:opacity .35s ease, transform .35s ease;}
.slide-fade.out{opacity:0;transform:translateY(8px);}
.nav-btn{background:none;border:0.5px solid var(--border-strong);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);transition:transform .1s ease, background .15s;}
.nav-btn:hover{background:var(--surface-1);}
.nav-btn:active{transform:scale(0.88);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border-strong);cursor:pointer;border:none;padding:0;transition:all .25s ease;}
.dot.active{background:var(--text-accent);width:20px;border-radius:4px;animation:dotPulse 2s ease-out infinite;}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 rgba(42,120,214,0.45);}70%{box-shadow:0 0 0 6px rgba(42,120,214,0);}100%{box-shadow:0 0 0 0 rgba(42,120,214,0);}}
.accent-stripe{transform-origin:left;animation:stripeIn .6s cubic-bezier(.2,.7,.3,1);}
@keyframes stripeIn{from{transform:scaleX(0);}to{transform:scaleX(1);}}
.reveal-item{opacity:0;animation:revealIn .5s ease forwards;}
@keyframes revealIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.metric-pick{transition:transform .15s ease, box-shadow .15s, background .15s;}
.metric-pick:hover{transform:translateY(-3px);}
body.presenting .topbar{display:none;}
body.presenting .page-wide{max-width:100%;padding-top:2rem;}
.nav-float{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;justify-content:center;gap:16px;background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:999px;padding:8px 18px;box-shadow:0 4px 18px rgba(0,0,0,0.18);}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(70px);z-index:1;}
.b1{width:460px;height:460px;background:#378add;opacity:0.6;top:-140px;left:-100px;animation:drift1 8s ease-in-out infinite alternate;}
.b2{width:420px;height:420px;background:#7f77dd;opacity:0.55;bottom:-170px;right:-80px;animation:drift2 9.5s ease-in-out infinite alternate;}
.b3{width:360px;height:360px;background:#1d9e75;opacity:0.5;top:32%;right:6%;animation:drift3 7s ease-in-out infinite alternate;}
.b4{width:340px;height:340px;background:#d4537e;opacity:0.5;bottom:2%;left:4%;animation:drift4 10.5s ease-in-out infinite alternate;}
@keyframes drift1{0%{transform:translate(0,0) scale(1);}100%{transform:translate(130px,90px) scale(1.25);}}
@keyframes drift2{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-110px,-70px) scale(1.2);}}
@keyframes drift3{0%{transform:translate(0,0) scale(1);}100%{transform:translate(-90px,100px) scale(1.3);}}
@keyframes drift4{0%{transform:translate(0,0) scale(1);}100%{transform:translate(90px,-85px) scale(1.2);}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="assets/mul-logo.png" alt="Minhaj University Lahore" class="brand-logo">&nbsp;Paid marketing report</div>
    <nav>
      <span id="mode-badge" style="font-size:12px;color:var(--text-muted);align-self:center;"></span>
      <a class="btn" href="entry.html"><i class="ti ti-plus"></i> Add / update report</a>
      <button class="btn no-print" onclick="window.print()"><i class="ti ti-printer"></i> Print / PDF</button>
      <button class="btn no-print" id="present-btn"><i class="ti ti-maximize"></i> Present</button>
    </nav>
  </div>

  <div class="page page-wide">
    <div style="border:0.5px solid var(--border-strong);border-radius:16px;overflow:hidden;background:var(--surface-1);">
      <div id="slide-wrap" class="slide-fade" style="padding:1.75rem 2rem;"></div>
    </div>
  </div>

  <div class="no-print nav-float">
    <button class="nav-btn" id="prev-btn" aria-label="Previous slide"><i class="ti ti-chevron-left"></i></button>
    <div id="dots" style="display:flex;gap:6px;"></div>
    <button class="nav-btn" id="next-btn" aria-label="Next slide"><i class="ti ti-chevron-right"></i></button>
    <button class="nav-btn" id="play-btn" aria-label="Play slideshow" style="margin-left:8px;"><i class="ti ti-player-play"></i></button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
